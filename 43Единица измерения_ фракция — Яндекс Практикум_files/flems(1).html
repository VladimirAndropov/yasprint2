<style id="styles/style.css">* {

}

body {
  min-width: 850px;
  min-height: 100vh;
  margin: 0;
}

.grid {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 12px;
  padding: 0 12px;
}

.column {
  background-color: rgb(255 0 0 / 0.3);
}
</style></head>
