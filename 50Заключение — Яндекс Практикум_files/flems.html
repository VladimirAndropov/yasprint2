<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гриды</title>
    <link rel="stylesheet" href="./fonts.css">
    <link rel="stylesheet" href="./style.css">
  <style id="styles/style.css">* {
  box-sizing: border-box;
}

body {
  min-width: 850px;
  margin: 0;
  padding: 50px;
  font-family: 'Open Sans', sans-serif;
  font-size: 4rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  grid-template-rows: repeat(6, 1fr);
  gap: 1px;
  min-height: calc(100vh - 100px);
  border: 1px solid black;
  background-color: black;
}

div {
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: 800;
  text-transform: uppercase;
}

.grid1 {
  grid-column: 1/5;
  color: white;
  background-color: black;
}

.grid2 {
  grid-column: 1/5;
  grid-row: 2/7;
  background-color: white;
  background-image: url(https://code.s3.yandex.net/web-code/images/dotted.svg);
}

.grid3 {
  grid-column: 5/8;
  grid-row: 1/3;
  background-color: #6dc1fd;
}

.grid4 {
  grid-column: 8/9;
  background-color: #fd24af;
}

.grid5 {
  grid-column: 8/9;
  grid-row: 2/3;
  background-color: #80d994;
}

.grid6 {
  grid-column: 9/11;
  grid-row: 1/5;
  color: white;
  direction: ltr;
  writing-mode: vertical-rl;
  background-color: #5f0dee;
}

.grid7 {
  grid-column: 5/9;
  grid-row: 3/5;
  background-color: #feafe8;
}

.grid8 {
  grid-column: 5/7;
  grid-row: 5/7;
  background-color: #c4c4c4;
}

.grid9 {
  grid-column: 7/9;
  grid-row: 5/7;
  background-color: white;
  background-image: url(https://code.s3.yandex.net/web-code/images/dotted-l.svg);
}

.grid10 {
  grid-column: 9/11;
  grid-row: 5/7;
  background-color: #ffc802;
}
</style></head>
  <body>
    <section class="grid">
      <div class="grid1">Мама</div>
      <div class="grid2">Дорогая</div>
      <div class="grid3">Как</div>
      <div class="grid4"></div>
      <div class="grid5"></div>
      <div class="grid6">Верстать</div>
      <div class="grid7">Я буду</div>
      <div class="grid8">Такое</div>
      <div class="grid9"></div>
      <div class="grid10">?</div>
    </section>
  

</body></html>
