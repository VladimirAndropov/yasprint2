    <title>Управление интерлиньяжем</title>

  <style id="styles/range.css">input[type=range] {
  width: 100%;
  background-color: transparent;
  -webkit-appearance: none;
  appearance: none;
}

input[type=range]::-webkit-slider-runnable-track {
  width: 100%;
  height: 10px;
  border: 1px solid #000;
  border-radius: 0;
  background-color: #000;
  cursor: pointer;
}

input[type=range]::-webkit-slider-thumb {
  width: 26px;
  height: 16px;
  margin-top: -4px;
  border: 1px solid #000;
  border-radius: 0;
  background: #fff;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}

input[type=range]:focus::-webkit-slider-runnable-track {
  background: #000;
}

input[type=range]::-moz-range-track {
  width: 100%;
  height: 10px;
  border: 1px solid #000;
  border-radius: 0;
  background-color: #000;
  cursor: pointer;
}

input[type=range]::-moz-range-thumb {
  width: 26px;
  height: 16px;
  border: 1px solid #000;
  border-radius: 0;
  background: #fff;
  cursor: pointer;
}

input[type=range]:focus {
  outline: 2px solid #000;
  outline-offset: 2px;
}
</style><style id="styles/style.css">*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  display: flex;
  min-width: 600px;
  min-height: 100vh;
  margin: 0;
  font-family: 'Open Sans', sans-serif;
  font-size: 18px;
  background-color: #fff;
  background-image: url(https://code.s3.yandex.net/web-code/images/dotted.svg);
}

p {
  margin: 0;
}

.wrapper {
  max-width: 500px;
  min-height: 380px;
  margin: auto;
  border: 1px solid #000;
  background-color: #fff;
}

.line-height-way-chooser {
  border-bottom: 1px solid #000;
  padding: 20px;
  color: #fff;
  background-color: #5f0dee;
}

.line-height-way-chooser h2 {
  font-weight: 800;
  font-size: 25px;
  text-align: center;
  text-transform: uppercase;
}

.line-height-way-chooser p {
  margin-bottom: 20px;
}

.line-height-way-chooser label {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

.line-height-way-chooser label:not(:last-of-type) {
  margin-right: 20px;
}

.line-height-way-chooser input {
  width: 27px;
  height: 27px;
  accent-color: #000;
}

.controller {
  padding: 20px;
}

.controller p {
  margin-bottom: 20px;
}

.text-container {
  padding: 20px;
}

.text-container p {
  border-top: 1px dotted #1e1e1e;
  border-bottom: 1px dotted #1e1e1e;
  line-height: 40px;
  text-align: center;
}
</style></head>
  <body>
    <div class="wrapper">
      <form class="line-height-way-chooser">
        <h2>Как задать интерлиньяж?</h2>
        <label>
          <input checked="" type="radio" name="lh" value="pixels">
          <span>40 пикселей</span>
        </label>
        <label>
          <input type="radio" name="lh" value="fraction">
          <span>В долях</span>
        </label>
      </form>
      <div class="controller">
        <p>Управляйте размером шрифта и смотрите как меняется высота линии</p>
        <input type="range" min="0" max="2" step="0.1">
      </div>
      <div class="text-container">
        <p>Мир придёт</p>
      </div>
    </div>
