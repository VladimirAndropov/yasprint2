  <title>Плиточная раскладка на гридах</title>
  <link rel="stylesheet" href="./style(1).css">
<style id="styles/style.css">body {
  min-width: 850px;
  max-width: 850px;
  margin: 0;
}

img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, calc((100% - 30px)/4));
  gap: 10px;
  height: 100vh;
}

img:first-of-type {
  grid-column: 1/3;
  grid-row: 1/3;
}

img:nth-of-type(2) {
  grid-column: 1/2;
  grid-row: 3/5;
}

img:nth-of-type(3) {
  grid-column: 2/3;
  grid-row: 3/5;
}

img:nth-of-type(4) {
  grid-column: 3/5;
  grid-row: 1/2;
}

img:nth-of-type(5) {
  grid-column: 3/5;
  grid-row: 2/3;
}

img:nth-of-type(6) {
  grid-column: 3/5;
  grid-row: 3/4;
}

img:nth-of-type(7) {
  grid-column: 3/5;
  grid-row: 4/5;
}

.img:nth-of-type(7) {
  grid-column: 3/5;
  grid-row: 1/2;
}
</style></head>
<body>
  <div class="grid">
    <img src="./1(1).jpg" alt="Куриные яйца с нарисованными на них лицами">
    <img src="./2(1).jpg" alt="Куриные яйца с нарисованными на них лицами">
    <img src="./3(1).jpg" alt="Куриные яйца с нарисованными на них лицами">
    <img src="./4(1).jpg" alt="Куриные яйца с нарисованными на них лицами">
    <img src="./5(1).jpg" alt="Куриные яйца с нарисованными на них лицами">
    <img src="./6(1).jpg" alt="Куриные яйца с нарисованными на них лицами">
    <img src="./7(1).jpg" alt="Куриные яйца с нарисованными на них лицами">
  </div>



</body></html>
