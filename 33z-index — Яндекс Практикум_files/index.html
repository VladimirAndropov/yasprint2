<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <style>
        body {
            margin: 0;
            font-family: 'Suisse', 'Helvetica', 'Arial', sans-serif;
        }
    </style>
<style type="text/css">.App-content{display:flex;justify-content:center;flex-direction:row;background-color:#1A1B22;min-height:400px}.wrapper{display:flex;justify-content:center;flex-direction:row;position:relative;height:400px;width:400px}.widget-select__label{font-family:'Suisse';font-weight:lighter}.integer-input{width:60px}.integer-input__input{width:30px;font-size:18px}.integer-input__button{width:30px}.integer-input_has-focus::after{width:30px}.navigation-wrapper{padding:16px;display:flex;justify-content:space-between;border:1px solid #1A1B22}.block{height:170px;width:200px;padding:16px 16px;position:absolute}.block--one{background:#FCC1AC;right:174px;top:80px}@media (max-width: 500px){.block--one{display:none}}.block--two{display:flex;flex-direction:column-reverse;background:#53F675;top:128px;right:26px}.block--three{background:#176BFF;top:28px}
</style><style type="text/css">.tooltip{position:relative;padding:8px 12px;background:#000000;color:#ffffff;font-size:14px;opacity:0;transition:bottom 0.25s, top 0.25s, opacity 0.25s}.tooltip::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:6px solid transparent}.tooltip_display{opacity:1}.tooltip_position-top{top:-8px;margin-bottom:6px}.tooltip_position-top.tooltip_display{top:0}.tooltip_position-top::after{bottom:-11px;border-top-color:#000000}.tooltip_position-bottom{bottom:-8px;margin-top:6px}.tooltip_position-bottom::after{top:-11px;border-bottom-color:#000000}.tooltip_position-bottom.tooltip_display{bottom:0}
</style><style type="text/css">.integer-input{display:flex;align-items:center;position:relative;min-width:30px;margin-top:1px;padding:2px 0;color:currentColor;border-bottom:1px solid rgba(0,0,0,0.25)}.integer-input::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:1px;background:#000000;transition:width 0.25s}.integer-input__input{flex-grow:1;background:transparent;border:0;outline:0}.integer-input__control{flex-grow:0;flex-shrink:0;flex-basis:32px;height:32px}.integer-input__tooltip{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);white-space:nowrap;pointer-events:none}.integer-input__button{height:50%;background:transparent;border:0;border-radius:0;outline:0;cursor:pointer;opacity:0.65;transition:opacity 0.15s}.integer-input__button:hover{opacity:1}.integer-input__button::before{content:"";display:inline-block;border:6px solid transparent}.integer-input__button_increase::before{border-bottom-color:#000000}.integer-input__button_decrease::before{border-top-color:#000000}.integer-input__button_disabled{cursor:default;opacity:0.25;pointer-events:none}
</style></head>
<body>
<div id="root"><div class="App"><div class="App-content"><div class="wrapper"><div class="block block--one" style="z-index: 1;"><label class="integer-input input"><input class="integer-input__input" type="text" maxlength="16" value="1"><div class="integer-input__control"><button class="integer-input__button integer-input__button_increase" type="button"></button><button class="integer-input__button integer-input__button_decrease" type="button"></button></div></label></div><div class="block block--two" style="z-index: 2;"><label class="integer-input"><input class="integer-input__input" type="text" maxlength="16" value="2"><div class="integer-input__control"><button class="integer-input__button integer-input__button_increase" type="button"></button><button class="integer-input__button integer-input__button_decrease" type="button"></button></div></label></div><div class="block block--three" style="z-index: 3;"><label class="integer-input"><input class="integer-input__input" type="text" maxlength="16" value="3"><div class="integer-input__control"><button class="integer-input__button integer-input__button_increase" type="button"></button><button class="integer-input__button integer-input__button_decrease" type="button"></button></div></label></div></div></div></div></div>
