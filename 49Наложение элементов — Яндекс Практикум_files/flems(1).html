<style id="fonts/font.css">@font-face {
  font-family: Comforter;
  src:
    url(./fonts/Comforter-Regular.woff2) format('woff2'),
    url(./fonts/Comforter-Regular.woff) format('woff');
  font-weight: normal;
  font-display: swap;
}
</style><style id="styles/style.css">* {
  box-sizing: border-box;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-width: 850px;
  min-height: 100vh;
  margin: 0;
  background-color: #fd24af;
}

.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  grid-template-rows: repeat(12, 1fr);
  width: 600px;
  height: 400px;
}

.grid__finger {
  /* Ваш код */

  grid-column: 1/5;
  grid-row: -1/-6;
  width: 100%;
  height: 100%;
}

.grid__quote {
  display: flex;
  justify-content: center;
  grid-column: 2/12;
  grid-row: 3/11;
  align-items: center;
  margin: 0;
  border-radius: 50%;
  font-family: Comforter, fantasy;
  font-size: 50px;
  text-align: center;
  background-color: #fff;
}
</style></head>
<body>
  <div class="grid">
    <img src="./finger.svg" alt="иллюстрация с пальцем, указывающим вправо" class="grid__finger">
    <blockquote class="grid__quote">
      <p>Любовь стоит того,<br>чтобы ждать
      </p>
    </blockquote>
  </div>


</body></html>
