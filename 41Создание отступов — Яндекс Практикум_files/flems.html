<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Время поныть</title>
  <link rel="stylesheet" href="./fonts.css">
  <link rel="stylesheet" href="./style.css">
<style id="styles/style.css">* {
  box-sizing: border-box;
}

body {
  min-width: 850px;
  margin: 0;
  font-family: 'Open Sans', sans-serif;
  background-color: #000;
}

.container {
  display: grid;
  grid-template-columns: 190px 200px 270px;
  grid-template-rows: 150px 150px 100px;
}

.container p {
  margin: 0;
  padding: 10px;
  font-size: 40px;
}

.container p:first-of-type {
  background-color: white;
}

.container p:nth-of-type(2) {
  background-color: #feafe8;
}

.container p:nth-of-type(3) {
  background-color: #80d994;
}

.container p:nth-of-type(4) {
  background-color: #feafe8;
}

.container p:nth-of-type(5) {
  background-color: #80d994;
}

.container p:nth-of-type(6) {
  background-color: white;
}

.container p:nth-of-type(7) {
  background-color: white;
}

.container p:nth-of-type(8) {
  background-color: #feafe8;
}

.container p:nth-of-type(9) {
  background-color: #80d994;
}
</style></head>
<body>
  <div class="container">
    <p>как</p>
    <p>много</p>
    <p>информации</p>
    <p>неужели</p>
    <p>я</p>
    <p>всё</p>
    <p>это</p>
    <p>запомню</p>
    <p>?!</p>
  </div>


</body></html>
