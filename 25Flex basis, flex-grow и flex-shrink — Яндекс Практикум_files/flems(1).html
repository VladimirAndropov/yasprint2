<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Полезный подкаст</title>
    <link rel="stylesheet" href="./fonts.css">
    <link rel="stylesheet" href="./style(1).css">
  <style id="styles/style.css">* {
  box-sizing: border-box;
}

html {
  height: 100%;
}

body {
  display: flex;
  flex-direction: column;
  min-width: 850px;
  min-height: 100%;
  margin: 0;
  font-family: 'Open Sans', sans-serif;
  font-size: 18px;
}

header,
footer {
  display: flex;
  justify-content: center;
  padding: 25px 15px;
  background-color: #80d994;
}

h1 {
  font-weight: 800;
  font-size: 45px;
  text-transform: uppercase;
}

h2 {
  margin: 0;
  font-weight: 800;
  font-size: 38px;
  text-transform: uppercase;
}

.main {
  display: flex;
  flex-grow: 1;
  justify-content: center;
}

.content {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 25px;
  width: 100%;
  max-width: 1200px;
  padding: 15px;
}

.card {
  /* Задайте размер карточки с помощью flex-basis */
  
  /* Задайте flex-grow со значением 1 */

  min-height: 200px;
  border: 2px solid #000;
  text-align: center;
}

.card__content {
  padding: 15px 10px;
}

.card__image {
  width: 100%;
  height: 200px;
  border-bottom: 2px solid black;
  object-fit: cover;
}
</style></head>
  <body>
    <header>
      <h1 class="header__title">Полезный подкаст</h1>
    </header>
    <main class="main">
      <section class="content">
        <div class="card card_first">
          <img src="./image-1(1).jpg" alt="Листья зелёного растения крупно" class="card__image">
          <div class="card__content">
            <h2 class="card__title">Эпизод 1</h2>
            <p class="card__description">Как гореть, но не выгореть</p>
          </div>
        </div>
        <div class="card card_second">
          <img src="./image-2(1).jpg" alt="Листья папоротника крупно" class="card__image">
          <div class="card__content">
            <h2 class="card__title">Эпизод 2</h2>
            <p class="card__description">Где найти силы на учёбу</p>
          </div>
        </div>
        <div class="card card_third">
          <img src="./image-3(1).jpg" alt="Листья фиолетового растения крупно" class="card__image">
          <div class="card__content">
            <h2 class="card__title">Эпизод 3</h2>
            <p class="card__description">Как правильно отдыхать</p>
          </div>
        </div>
        <div class="card card_fourth">
          <img src="./image-4(1).jpg" alt="Листья ярко-красного растения крупно" class="card__image">
          <div class="card__content">
            <h2 class="card__title">Эпизод 4</h2>
            <p class="card__description">Как не надо учиться</p>
          </div>
        </div>
        <div class="card card_fifth">
          <img src="./image-5(1).jpg" alt="Коричневый плод растения крупно" class="card__image">
          <div class="card__content">
            <h2 class="card__title">Эпизод 5</h2>
            <p class="card__description">Слушаем тихую музыку</p>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <p class="footer__text">Подписывайтесь везде</p>
    </footer>
  

</body></html>
